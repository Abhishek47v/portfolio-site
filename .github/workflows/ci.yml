name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Types and content schemas
        run: npm run check

      - name: Colour lives only in tokens.css
        run: npm run gate:tokens

      - run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility, contrast across the scroll range, and no-JS
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
